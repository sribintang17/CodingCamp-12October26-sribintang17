<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard – To-Do List</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════ HEADER ══ -->
  <header class="header">
    <div class="header__inner">

      <!-- Greeting & Name -->
      <div class="greeting-wrap">
        <p class="greeting" id="greeting">Selamat Pagi</p>
        <h1 class="username" id="username-display">Pengguna</h1>
        <button class="btn btn--ghost btn--sm" id="edit-name-btn" aria-label="Ubah nama">✏️ Ubah Nama</button>
      </div>

      <!-- Clock & Date -->
      <div class="clock-wrap">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date"  id="date">Senin, 1 Januari 2024</div>
      </div>

    </div>
  </header>

  <!-- ═══════════════════════════════════════ NAME MODAL ══ -->
  <div class="modal-overlay" id="name-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal">
      <h2 id="modal-title">Siapa namamu?</h2>
      <input
        type="text"
        id="name-input"
        class="input"
        placeholder="Masukkan namamu…"
        maxlength="40"
        autocomplete="off"
      />
      <div class="modal__actions">
        <button class="btn btn--primary" id="save-name-btn">Simpan</button>
        <button class="btn btn--ghost"   id="cancel-name-btn">Batal</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ MAIN ══ -->
  <main class="main">

    <!-- ── Focus Timer ── -->
    <section class="card" aria-labelledby="timer-heading">
      <h2 class="card__title" id="timer-heading">⏱ Focus Timer</h2>

      <div class="timer-display" id="timer-display" aria-live="polite">25:00</div>

      <div class="timer-controls">
        <button class="btn btn--primary"  id="timer-start"  aria-label="Mulai timer">▶ Start</button>
        <button class="btn btn--warning"  id="timer-stop"   aria-label="Jeda timer">⏸ Stop</button>
        <button class="btn btn--ghost"    id="timer-reset"  aria-label="Reset timer">↺ Reset</button>
      </div>

      <div class="timer-custom">
        <label for="timer-minutes" class="label">Atur durasi (menit):</label>
        <input
          type="number"
          id="timer-minutes"
          class="input input--sm"
          min="1" max="120" value="25"
          aria-label="Durasi timer dalam menit"
        />
        <button class="btn btn--ghost btn--sm" id="timer-set-btn">Set</button>
      </div>

      <p class="timer-status" id="timer-status">Siap untuk fokus!</p>
    </section>

    <!-- ── To-Do List ── -->
    <section class="card" aria-labelledby="todo-heading">
      <h2 class="card__title" id="todo-heading">✅ To-Do List</h2>

      <div class="todo-input-row">
        <input
          type="text"
          id="todo-input"
          class="input"
          placeholder="Tambah tugas baru…"
          maxlength="120"
          autocomplete="off"
          aria-label="Tugas baru"
        />
        <button class="btn btn--primary" id="todo-add-btn" aria-label="Tambah tugas">+ Tambah</button>
      </div>
      <p class="input-error" id="todo-error" role="alert" hidden></p>

      <div class="todo-toolbar">
        <span class="todo-count" id="todo-count">0 tugas</span>
        <div class="todo-sort">
          <label for="sort-select" class="label">Urutkan:</label>
          <select id="sort-select" class="select">
            <option value="default">Default</option>
            <option value="alpha">A → Z</option>
            <option value="done-last">Selesai di Bawah</option>
            <option value="done-first">Selesai di Atas</option>
          </select>
        </div>
      </div>

      <ul class="todo-list" id="todo-list" aria-label="Daftar tugas" aria-live="polite"></ul>

      <button class="btn btn--danger btn--sm" id="clear-done-btn" aria-label="Hapus semua tugas selesai">
        🗑 Hapus Tugas Selesai
      </button>
    </section>

    <!-- ── Quick Links ── -->
    <section class="card" aria-labelledby="links-heading">
      <h2 class="card__title" id="links-heading">🔗 Quick Links</h2>

      <div class="links-input-row">
        <input
          type="text"
          id="link-name-input"
          class="input"
          placeholder="Nama link…"
          maxlength="40"
          autocomplete="off"
          aria-label="Nama link"
        />
        <input
          type="url"
          id="link-url-input"
          class="input"
          placeholder="https://…"
          autocomplete="off"
          aria-label="URL link"
        />
        <button class="btn btn--primary" id="link-add-btn" aria-label="Tambah link">+ Tambah</button>
      </div>
      <p class="input-error" id="link-error" role="alert" hidden></p>

      <ul class="links-list" id="links-list" aria-label="Daftar link" aria-live="polite"></ul>
    </section>

  </main>

  <!-- ═══════════════════════════════════════ TOAST ══ -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- ═══════════════════════════════════════ EDIT TODO MODAL ══ -->
  <div class="modal-overlay" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title" hidden>
    <div class="modal">
      <h2 id="edit-modal-title">Edit Tugas</h2>
      <input
        type="text"
        id="edit-todo-input"
        class="input"
        placeholder="Teks tugas…"
        maxlength="120"
        autocomplete="off"
      />
      <p class="input-error" id="edit-error" role="alert" hidden></p>
      <div class="modal__actions">
        <button class="btn btn--primary" id="save-edit-btn">Simpan</button>
        <button class="btn btn--ghost"   id="cancel-edit-btn">Batal</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
